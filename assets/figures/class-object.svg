<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t">
  <title id="t">class Student เป็นแม่แบบ สร้าง object ได้หลายตัว แต่ละตัวมีข้อมูลของตัวเอง</title>
  <style>
    text { font-family: "Leelawadee UI", Tahoma, sans-serif; fill: #202440; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .cap { fill: #62677b; font-size: 13px; }
    .arrow { stroke: #ff755e; stroke-width: 2.5; fill: none; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff755e"/></marker></defs>
  <rect x="20" y="40" width="250" height="150" rx="10" fill="#fffefa" stroke="#192044" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="40" width="250" height="38" rx="10" fill="#192044"/>
  <text x="145" y="65" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" class="mono">class Student</text>
  <text x="40" y="104" class="cap">attribute (ข้อมูล)</text>
  <text x="40" y="126" font-size="15" class="mono">name, score</text>
  <text x="40" y="156" class="cap">method (การทำงาน)</text>
  <text x="40" y="178" font-size="15" class="mono">grade()</text>
  <text x="145" y="216" text-anchor="middle" class="cap">แม่แบบ — ยังไม่มีข้อมูลจริง</text>
  <path d="M276 90 C 340 90, 360 60, 420 60" class="arrow" marker-end="url(#a)"/>
  <path d="M276 150 C 340 150, 360 170, 420 170" class="arrow" marker-end="url(#a)"/>
  <text x="300" y="124" class="cap mono">Student(...)</text>
  <g transform="translate(428,24)">
    <rect width="300" height="72" rx="10" fill="#e6f4ee" stroke="#147d70" stroke-width="1.5"/>
    <text x="16" y="28" font-weight="700" class="mono" font-size="15">a = Student("Nina", 88)</text>
    <text x="16" y="54" font-size="14" class="mono">name="Nina"  score=88</text>
  </g>
  <g transform="translate(428,134)">
    <rect width="300" height="72" rx="10" fill="#e6f4ee" stroke="#147d70" stroke-width="1.5"/>
    <text x="16" y="28" font-weight="700" class="mono" font-size="15">b = Student("Beam", 72)</text>
    <text x="16" y="54" font-size="14" class="mono">name="Beam"  score=72</text>
  </g>
  <text x="578" y="226" text-anchor="middle" class="cap">object — ของจริง แต่ละตัวมีข้อมูลแยกกัน</text>
</svg>
