<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t">
  <title id="t">array 3x4: axis=0 รวมลงแนวตั้งได้ผลรวมต่อคอลัมน์ axis=1 รวมตามแนวนอนได้ผลรวมต่อแถว</title>
  <style>
    text { font-family: "Leelawadee UI", Tahoma, sans-serif; fill: #202440; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 16px; }
    .cap { fill: #62677b; font-size: 13px; }
    .sum0 { fill: #147d70; font-weight: 700; }
    .sum1 { fill: #ba4b3a; font-weight: 700; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#147d70"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ba4b3a"/></marker>
  </defs>
  <g transform="translate(150,30)">
    <rect width="320" height="144" rx="6" fill="#fffefa" stroke="#192044" stroke-width="1.5"/>
    <path d="M80 0V144M160 0V144M240 0V144M0 48H320M0 96H320" stroke="#d9d8cf"/>
    <g class="mono" text-anchor="middle">
      <text x="40" y="30">10</text><text x="120" y="30">12</text><text x="200" y="30">9</text><text x="280" y="30">14</text>
      <text x="40" y="78">7</text><text x="120" y="78">8</text><text x="200" y="78">11</text><text x="280" y="78">6</text>
      <text x="40" y="126">15</text><text x="120" y="126">13</text><text x="200" y="126">12</text><text x="280" y="126">18</text>
    </g>
    <path d="M-20 8V136" stroke="#147d70" stroke-width="3" marker-end="url(#g)"/>
    <path d="M8 -12H312" stroke="#ba4b3a" stroke-width="3" marker-end="url(#r)"/>
    <g class="mono sum0" text-anchor="middle">
      <text x="40" y="172">32</text><text x="120" y="172">33</text><text x="200" y="172">32</text><text x="280" y="172">38</text>
    </g>
    <g class="mono sum1">
      <text x="340" y="30">45</text><text x="340" y="78">32</text><text x="340" y="126">58</text>
    </g>
  </g>
  <text x="20" y="100" class="sum0" font-size="14">axis=0</text>
  <text x="20" y="120" class="cap">รวมลงแนวตั้ง</text>
  <text x="150" y="232" class="cap">sum(axis=0) → ผลต่อคอลัมน์ (สีเขียว)</text>
  <text x="530" y="70" class="sum1" font-size="14">axis=1</text>
  <text x="530" y="90" class="cap">รวมตามแนวนอน</text>
  <text x="530" y="110" class="cap">sum(axis=1) → ผลต่อแถว</text>
  <text x="530" y="130" class="cap">(สีแดง)</text>
</svg>
